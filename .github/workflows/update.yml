name: Auto-Sync SIH Submissions

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Automatically runs every 30 minutes
  push:
    paths:
      - '.github/workflows/update.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Connection to SIH
        run: |
          echo "=== Testing direct HTTP response from GitHub Actions runner ==="
          curl -s -k -I -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36" -H "Referer: https://sih.gov.in/" https://sih.gov.in/sih2026PS | head -n 10 || true

      - name: Run Scraper
        run: |
          python3 scraper.py
          cp data/sih2026_data.json public/data/sih2026_data.json

      - name: Commit and push if changed
        run: |
          git config --global user.name "SIH Auto Sync Bot"
          git config --global user.email "bot@github-actions.local"
          git add data/sih2026_data.json public/data/sih2026_data.json
          if git diff --staged --quiet; then
            echo "No changes in submissions data."
          else
            git commit -m "Auto-sync: updated live submissions from sih.gov.in"
            git push
          fi
