steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sih2026-tracker:$COMMIT_SHA', '.']

  # 2. Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sih2026-tracker:$COMMIT_SHA']

  # 3. Deploy to Cloud Run in Mumbai (asia-south1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sih2026-tracker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sih2026-tracker:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/sih2026-tracker:$COMMIT_SHA'
